body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing an idea! This is a good place to discuss something before it becomes a formal feature request.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this solve? Describe the situation you run into, not the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed idea
      description: What would you like to see? A rough sketch is fine - it does not need to be fully worked out.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you have thought about, and why they fall short.
    validations:
      required: false
